services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medtrace-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Offline judge mode by default. For live runs set SAMPLE_MODE=false and the Nightshift/Zetaris variables from .env.example.
      - SAMPLE_MODE=${SAMPLE_MODE:-true}
      - USE_ZETARIS=${USE_ZETARIS:-false}
      - LOGS_DIR=logs
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
