<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Master 3D Cross Gradient -->
    <linearGradient id="fav-cross" x1="6" y1="58" x2="58" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="30%" stop-color="#0EA5E9"/>
      <stop offset="65%" stop-color="#06B6D4"/>
      <stop offset="85%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Top/Left Specular Highlight Rim -->
    <linearGradient id="fav-rim-lt" x1="8" y1="8" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Shadow for 3D Depth -->
    <linearGradient id="fav-shadow" x1="20" y1="20" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0369A1" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#082F49" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#021C2F" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Graph Connecting Rod Gradient -->
    <linearGradient id="fav-rod" x1="8" y1="46" x2="56" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Metallic Silver Collar Gradient -->
    <linearGradient id="fav-collar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Glowing Green Core -->
    <radialGradient id="fav-core-green" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>

    <!-- Glowing Cyan Core -->
    <radialGradient id="fav-core-cyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
  </defs>

  <!-- Ambient Shadow -->
  <path d="M 23 8 C 23 5.5 24.8 4 27 4 L 37 4 C 39.2 4 41 5.5 41 8 L 41 21 L 54 21 C 56.5 21 58 22.8 58 25 L 58 35 C 58 37.2 56.5 39 54 39 L 41 39 L 41 52 C 41 54.5 39.2 56 37 56 L 27 56 C 24.8 56 23 54.5 23 52 L 23 39 L 10 39 C 7.5 39 6 37.2 6 35 L 6 25 C 6 22.8 7.5 21 10 21 L 23 21 Z" fill="rgba(0,0,0,0.5)" transform="translate(1.5, 3)"/>

  <!-- 3D Cross Depth -->
  <path d="M 23 7 C 23 4.8 24.8 3.5 27 3.5 L 37 3.5 C 39.2 3.5 41 4.8 41 7 L 41 21 L 55 21 C 57.2 21 58.5 22.8 58.5 25 L 58.5 35 C 58.5 37.2 57.2 39 55 39 L 41 39 L 41 53 C 41 55.2 39.2 56.5 37 56.5 L 27 56.5 C 24.8 56.5 23 55.2 23 53 L 23 39 L 9 39 C 6.8 39 5.5 37.2 5.5 25 L 5.5 25 C 5.5 22.8 6.8 21 9 21 L 23 21 Z" fill="url(#fav-shadow)" transform="translate(0.8, 1.5)"/>

  <!-- Outer Rounded Medical Cross Frame -->
  <path d="M 23 6 C 23 4 24.8 2.5 27 2.5 L 37 2.5 C 39.2 2.5 41 4 41 6 L 41 20 L 55 20 C 57 20 58.5 21.8 58.5 24 L 58.5 34 C 58.5 36.2 57 38 55 38 L 41 38 L 41 52 C 41 54 39.2 55.5 37 55.5 L 27 55.5 C 24.8 55.5 23 54 23 52 L 23 38 L 9 38 C 7 38 5.5 36.2 5.5 34 L 5.5 24 C 5.5 21.8 7 20 9 20 L 23 20 Z" fill="url(#fav-cross)"/>

  <!-- Hollow Aperture Inner Cutout -->
  <path d="M 26 15 C 26 13.8 27 13 28.2 13 L 33.8 13 C 35 13 36 13.8 36 15 L 36 24 L 45 24 C 46.2 24 47 24.8 47 26 L 47 30 C 47 31.2 46.2 32 45 32 L 36 32 L 36 41 C 36 42.2 35 43 33.8 43 L 28.2 43 C 27 43 26 42.2 26 41 L 26 32 L 17 32 C 15.8 32 15 31.2 15 30 L 15 26 C 15 24.8 15.8 24 17 24 L 26 24 Z" fill="#080A0E" stroke="url(#fav-shadow)" stroke-width="1"/>

  <!-- Top / Left Specular Highlight Rim -->
  <path d="M 27 2.5 L 37 2.5 C 39.2 2.5 41 4 41 6 L 41 8 L 27 8 Z M 5.5 24 L 5.5 34 L 7.5 34 L 7.5 24 Z M 23 20 L 9 20 C 7 20 5.5 21.8 5.5 24 L 7.5 24 L 23 22 Z M 41 20 L 55 20 C 57 20 58.5 21.8 58.5 24 L 56.5 24 L 41 22 Z" fill="url(#fav-rim-lt)"/>

  <!-- 5-Node Rising Graph with Central Diamond Audit Loop -->
  <!-- Connecting Rods -->
  <line x1="8" y1="45" x2="20" y2="33" stroke="url(#fav-rod)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="20,33 32,21 44,33 32,45" fill="rgba(45, 212, 191, 0.12)" stroke="url(#fav-rod)" stroke-width="3" stroke-linejoin="round"/>
  <line x1="44" y1="33" x2="56" y2="21" stroke="url(#fav-rod)" stroke-width="3" stroke-linecap="round"/>

  <!-- Node 1: Bottom-Left Exterior -->
  <circle cx="8" cy="45" r="4.2" fill="url(#fav-collar)"/>
  <circle cx="8" cy="45" r="2.5" fill="url(#fav-core-green)"/>

  <!-- Node 2: Left Diamond Junction -->
  <circle cx="20" cy="33" r="3.6" fill="url(#fav-collar)"/>
  <circle cx="20" cy="33" r="2" fill="url(#fav-core-cyan)"/>

  <!-- Node 3: Top Diamond Peak -->
  <circle cx="32" cy="21" r="3.6" fill="url(#fav-collar)"/>
  <circle cx="32" cy="21" r="2" fill="url(#fav-core-cyan)"/>

  <!-- Node 4: Bottom Diamond -->
  <circle cx="32" cy="45" r="3.6" fill="url(#fav-collar)"/>
  <circle cx="32" cy="45" r="2" fill="url(#fav-core-cyan)"/>

  <!-- Node 5: Right Diamond Junction -->
  <circle cx="44" cy="33" r="3.6" fill="url(#fav-collar)"/>
  <circle cx="44" cy="33" r="2" fill="url(#fav-core-cyan)"/>

  <!-- Node 6: Top-Right Exterior -->
  <circle cx="56" cy="21" r="4.5" fill="url(#fav-collar)"/>
  <circle cx="56" cy="21" r="2.8" fill="url(#fav-core-green)"/>
</svg>
